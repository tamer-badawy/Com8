name: Multi-Platform Build CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        # Multi-platform matrix covering Linux, Mac, and Windows environments
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Repository (Linux/macOS)
      if: matrix.os != 'windows-latest'
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Manual, custom checkout for Windows to completely bypass the git init bug
    - name: Custom Checkout (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        # Force set the global safe directory path tracking parameters
        git config --global --add safe.directory D:/a/Com8/Com8
        
        # Clone the repo directly into the workspace root instead of initializing inside it
        git clone https://github.com{{ github.repository }}.git .
        
        # If your action run is triggered by a pull request or specific branch, match the tracking commit head
        git checkout ${{ github.sha }}
        git submodule update --init --recursive

    # --- PLATFORM SPECIFIC DEPENDENCY SETUPS ---
    
    # 1. Linux requires windowing system headers to compile Raylib from source
    - name: Install Linux Graphics Development Headers
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

    # 2. Windows needs the MSVC compiler environment set up (handled natively by GitHub runners)
    - name: Enable MSVC Developer Command Prompt
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    # --- UNIVERSAL CMAKE COMPILATION PIPELINE ---

    - name: Configure CMake Build Target Tree
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Compile Com8 Engine Binary
      run: cmake --build build --config Release

    # --- PLATFORM SPECIFIC BUILD VERIFICATIONS ---

    - name: Verify Linux / macOS Binary Output
      if: matrix.os != 'windows-latest'
      run: |
        if [ ! -f build/Com8 ]; then
          echo "Error: Com8 binary build asset missing."
          exit 1
        fi
        echo "Unix-based target compiled successfully!"

    - name: Verify Windows Executable Output
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        if (-not (Test-Path "build\Release\Com8.exe")) {
          Write-Error "Error: Com8.exe binary build asset missing."
          exit 1
        }
        Write-Output "Windows target compiled successfully!"
