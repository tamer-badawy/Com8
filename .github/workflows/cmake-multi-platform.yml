name: Multi-Platform Build CI

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ] # Kicks off the automated release whenever you push a tag like v1.0.0
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write
      discussions: write # Optional: needed if you want linked release discussions
    
    
    strategy:
      fail-fast: false
      matrix:
        # Multi-platform matrix covering Linux, Mac environments
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        clean: true
        submodules: recursive

    # --- PLATFORM SPECIFIC DEPENDENCY SETUPS ---
    
    # 1. Linux requires windowing system headers to compile Raylib from source
    - name: Install Linux Graphics Development Headers
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev


    # --- UNIVERSAL CMAKE COMPILATION PIPELINE ---

    - name: Configure CMake Build Target Tree
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Compile Com8 Engine Binary
      run: cmake --build build --config Release

    # --- PLATFORM SPECIFIC BUILD VERIFICATIONS ---

    - name: Verify Linux / macOS Binary Output
      if: matrix.os != 'windows-latest'
      run: |
        if [ ! -f build/Com8 ]; then
          echo "Error: Com8 binary build asset missing."
          exit 1
        fi
        echo "Unix-based target compiled successfully!"

    # 5. Native target compression packaging scripts
    - name: Package Linux Binary Asset
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p dist
        cp build/Com8 dist/
        cd dist && tar -czf com8-linux-x64.tar.gz Com8

    - name: Package macOS Binary Asset
      if: matrix.os == 'macos-latest'
      run: |
        mkdir -p dist
        cp build/Com8 dist/
        cd dist && tar -czf com8-macos-universal.tar.gz Com8

    # 6. Public release generation via the official action platform hook
    - name: Create Official GitHub Release Distribution
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/com8-*
        generate_release_notes: true
