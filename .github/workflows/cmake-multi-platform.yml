name: Multi-Platform Build CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        # Multi-platform matrix covering Linux, Mac, and Windows environments
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Repository (Linux/macOS)
      if: matrix.os != 'windows-latest'
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Hardcore Bypassing Step for Windows (Completely avoids the broken D:\ drive git virtualization)
    - name: Custom Zip Extract Checkout (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        # Download a clean, flat zip snapshot of your code using the specific workflow trigger SHA commit token
        $zipUrl = "https://github.com{{ github.repository }}/archive/${{ github.sha }}.zip"
        Invoke-WebRequest -Uri $zipUrl -OutFile "source.zip"
        
        # Extract the archive into a separate workspace directory segment layer
        Expand-Archive -Path "source.zip" -DestinationPath "extracted_root"
        
        # GitHub names the zipped root folder as "RepositoryName-CommitSHA"
        $extractedDir = Get-ChildItem -Path "extracted_root" | Select-Object -First 1
        
        # Move all your files (main.cpp, Chip8.hpp, CMakeLists.txt) into the root working directory manually
        Copy-Item -Path "$($extractedDir.FullName)\*" -Destination "." -Recurforce -Recurse
        
        # Clean up temporary zip extractions safely
        Remove-Item -Path "source.zip", "extracted_root" -Recurse -Force
        Write-Output "Windows files staged without touching the broken git client layer successfully!"


    # --- PLATFORM SPECIFIC DEPENDENCY SETUPS ---
    
    # 1. Linux requires windowing system headers to compile Raylib from source
    - name: Install Linux Graphics Development Headers
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

    # 2. Windows needs the MSVC compiler environment set up (handled natively by GitHub runners)
    - name: Enable MSVC Developer Command Prompt
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    # --- UNIVERSAL CMAKE COMPILATION PIPELINE ---

    - name: Configure CMake Build Target Tree
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Compile Com8 Engine Binary
      run: cmake --build build --config Release

    # --- PLATFORM SPECIFIC BUILD VERIFICATIONS ---

    - name: Verify Linux / macOS Binary Output
      if: matrix.os != 'windows-latest'
      run: |
        if [ ! -f build/Com8 ]; then
          echo "Error: Com8 binary build asset missing."
          exit 1
        fi
        echo "Unix-based target compiled successfully!"

    - name: Verify Windows Executable Output
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        if (-not (Test-Path "build\Release\Com8.exe")) {
          Write-Error "Error: Com8.exe binary build asset missing."
          exit 1
        }
        Write-Output "Windows target compiled successfully!"
